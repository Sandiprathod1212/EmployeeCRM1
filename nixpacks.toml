[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nodejs_20", "php84Extensions.gd", "php84Extensions.pdo_mysql"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm ci"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "php artisan migrate --force && php artisan storage:link && php artisan serve --host=0.0.0.0 --port=$PORT"
